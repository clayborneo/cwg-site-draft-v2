name = "cwg-contact-form"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
TO_EMAIL = "info@caringwithgrace.com"
FROM_EMAIL = "website@caringwithgrace.com"
ALLOWED_ORIGINS = "https://clayborneo.github.io,https://www.caringwithgrace.com,https://caringwithgrace.com"
# "true" = refuse to send unless TURNSTILE_SECRET is set. Use "false" only for the
# first delivery tests, then turn it back on before the form is public.
REQUIRE_TURNSTILE = "true"
